apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app
  namespace: production
  labels:
    app: django-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: django-app
    spec:
      containers:
        - name: django-app
          # Use the image that your Jenkins pipeline pushes (tag will be set by pipeline)
          image: rithwik504/basic-project:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          # Minimal resources - tune for your workload
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Basic readiness/liveness checks (assumes gunicorn serving at / or /health)
          readinessProbe:
            httpGet:
              path: /       # change to /health if you have a health endpoint
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 5
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "leature3.settings"
            # Example: load secret key and DB creds from k8s Secret (create these in the cluster)
            # - name: SECRET_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: django-secret
            #       key: SECRET_KEY
          # If your app writes files, mount PersistentVolumeClaim here (optional)
      # Uncomment and add tolerations/nodeSelector if you have special nodes
