name: Django CI/CD (No Build, No Scripts)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  # Must run on your local Minikube host

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify kubectl connection
        run: kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f django-applications/leature3/k8s/deployment.yaml
          kubectl apply -f django-applications/leature3/k8s/service.yaml
